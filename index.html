<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Наплыв 3D (офлайн)</title>
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b1417"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--ink:#eef4f2;--am:#ffd25a;--rd:#ff5d73;--mn:#5df0c0;--pn:#14262b;--h:'Arial Black','Segoe UI Black',Impact,system-ui,sans-serif;--b:system-ui,'Segoe UI',Roboto,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{overscroll-behavior:none;height:100%;margin:0;background:#0b1417;color:var(--ink);font-family:var(--b);overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#o{pointer-events:none}
#c{image-rendering:crisp-edges;image-rendering:pixelated}
.gt{margin:12px 0 6px;font-size:12px;color:#8fa3a8;text-transform:uppercase;letter-spacing:.08em}.gr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.opt{background:#14262b;border:2px solid #2c4a52;border-radius:10px;color:#eef4f2;font:400 14px var(--b);padding:10px 14px;cursor:pointer}.opt.on{border-color:#ffd25a;color:#ffd25a;background:#1c3a40}.pk[disabled]{opacity:.45}
#ab{position:fixed;right:22px;bottom:calc(120px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;border:3px solid #ffd25a;background:rgba(20,38,43,.7);color:#eef4f2;font:400 12px var(--h);cursor:pointer;overflow:hidden;padding:0}
#ab i{position:absolute;left:0;right:0;bottom:0;background:rgba(255,210,90,.3);height:0}
#ab span{position:relative}
#inv{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 130px);font-size:18px;line-height:1.5;pointer-events:none;text-shadow:0 2px 4px #000}
#mu{position:fixed;right:12px;top:calc(62px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:50%;border:2px solid #2c4a52;background:rgba(20,38,43,.7);font-size:17px;cursor:pointer;padding:0}
#vg{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,60,80,.38))}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.bar{height:14px;border-radius:7px;background:rgba(0,0,0,.5);overflow:hidden;position:relative;margin-bottom:5px}
.bar i{position:absolute;inset:0;width:100%;transition:width .12s}
#hl{width:min(190px,38vw)}#hr{text-align:right;font-family:var(--h);font-size:15px;line-height:1.4}
#hc{text-align:center;font-family:var(--h)}#wv{font-size:20px}#tm{font-size:26px;color:var(--am);line-height:1}
#boss{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));width:min(380px,70vw);display:none}
#boss .bar{height:12px}
#bn{position:fixed;left:0;right:0;top:34%;text-align:center;font:400 clamp(30px,8vw,56px)/1.1 var(--h);color:var(--am);text-shadow:0 4px 0 rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .35s}
#bn.on{opacity:1}
#dash{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:3px solid var(--mn);background:rgba(20,38,43,.7);color:var(--ink);font:400 15px var(--h);cursor:pointer;overflow:hidden}
#dash i{position:absolute;left:0;right:0;bottom:0;background:rgba(93,240,192,.28);height:0}
#dash span{position:relative}
#ov{position:fixed;inset:0;display:flex;background:rgba(7,13,15,.88);padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
#ov.hide{display:none}
.card{max-width:480px;width:100%;text-align:center;margin:auto}
.hg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;text-align:left}.hg .pk{margin-bottom:0}.card:has(.hg){max-width:960px}
@media (max-height:520px){#ov{padding:10px}h1{font-size:34px!important;margin-bottom:6px}p{margin-bottom:8px;font-size:13px}.pk{padding:9px 12px;font-size:13px}.pk b{font-size:15px}}
h1{font:400 clamp(44px,12vw,72px)/1 var(--h);margin:0 0 10px;color:var(--am);text-shadow:0 5px 0 rgba(0,0,0,.4)}
h2{font:400 24px var(--h);margin:0 0 8px}
p{line-height:1.5;margin:0 0 12px;color:#bdd0cc;font-size:15px}
.pk{display:block;width:100%;text-align:left;margin-bottom:9px;background:var(--pn);border:2px solid #2c4a52;border-radius:12px;padding:12px 15px;color:var(--ink);font:400 14px/1.4 var(--b);cursor:pointer}
.pk:hover,.pk:focus-visible{border-color:var(--am);outline:none}
.pk b{display:block;font:400 17px var(--h);margin-bottom:2px;color:var(--am)}
.pk em{float:right;font-style:normal;color:var(--mn);font:400 14px var(--h)}
.btn{font:400 19px var(--h);border:0;border-radius:12px;padding:14px 34px;background:var(--am);color:#1a1405;cursor:pointer;margin-top:6px}
.btn:focus-visible{outline:3px solid var(--mn);outline-offset:3px}
.big{font:400 50px var(--h);color:var(--am);margin:2px 0 8px}
.sm{font-size:12px;opacity:.75}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas><canvas id="o"></canvas><div id="vg"></div>
<div id="hud">
 <div id="hl"><div class="bar"><i id="hp" style="background:var(--rd)"></i></div><div class="bar" style="height:9px"><i id="xp" style="background:var(--mn)"></i></div><div id="lv" style="font:400 13px var(--h)"></div></div>
 <div id="hc"><div id="wv"></div><div id="tm"></div></div>
 <div id="hr"></div>
</div>
<div id="boss"><div class="bar"><i id="bh" style="background:#ff3d81"></i></div></div>
<div id="bn"></div>
<button id="dash" type="button" aria-label="Рывок"><i></i><span>Рывок</span></button>
<button id="ab" type="button" aria-label="Способность"><i></i><span>Q</span></button>
<div id="inv"></div><button id="mu" type="button" aria-label="Звук">🔊</button>
<div id="ov"><div class="card" id="card"></div></div>
